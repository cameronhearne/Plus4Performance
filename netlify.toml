[build]
  # Build the React app, then copy static marketing pages into dist so they're served alongside it.
  # client/app.html (not index.html) is the React entry — so copying index.html here doesn't conflict.
  command = """
    cd client && npm ci && npm run build &&
    cp ../index.html dist/index.html &&
    cp -r ../public/. dist/ &&
    # ^ everything under root public/ (e.g. public/images/) ships automatically —
    # drop new static assets there instead of adding a cp line here.
    cp ../logo-mark.png dist/logo-mark.png &&
    cp ../calculator.html dist/calculator.html &&
    cp ../privacy.html dist/privacy.html &&
    cp ../terms.html dist/terms.html &&
    cp ../guaranteed-coaching.html dist/guaranteed-coaching.html &&
    cp ../shop.html dist/shop.html &&
    mkdir -p dist/shop && cp -r ../shop/. dist/shop/ &&
    cp ../about.html dist/about.html &&
    cp ../guarantee-terms.html dist/guarantee-terms.html &&
    cp ../shipping-returns.html dist/shipping-returns.html &&
    cp ../size-guide.html dist/size-guide.html &&
    cp ../sitemap.xml dist/sitemap.xml &&
    cp ../robots.txt dist/robots.txt &&
    cp -r ../css dist/css &&
    cp -r ../js dist/js
  """
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "20"

# ─── SECURITY HEADERS ────────────────────────────────────────────────────────
# Applied to all routes on plus4performance.com

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co https://api.stripe.com wss://*.supabase.co https://plus4performance-production.up.railway.app; frame-src https://js.stripe.com; object-src 'none'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cache-Control = "public, max-age=0, must-revalidate"

# ─── CACHE HEADERS FOR STATIC ASSETS ─────────────────────────────────────────
# Vite outputs hashed filenames under /assets/ — safe to cache forever

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── MARKETING SITE — CLEAN URLS ──────────────────────────────────────────────
# Static files exist as *.html on disk; these map the clean paths onto them.
# (A request that hits a real file, e.g. /shop.html itself, is served directly —
# these rules only fire when there's no exact static-file match.)

[[redirects]]
  from = "/guaranteed-coaching"
  to = "/guaranteed-coaching.html"
  status = 200

[[redirects]]
  from = "/shop"
  to = "/shop.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/guarantee-terms"
  to = "/guarantee-terms.html"
  status = 200

[[redirects]]
  from = "/shipping-returns"
  to = "/shipping-returns.html"
  status = 200

[[redirects]]
  from = "/size-guide"
  to = "/size-guide.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

# Product detail pages: /shop/:slug renders the shared shop/product.html template,
# which looks the slug up in js/products.js. URL stays as /shop/:slug.
[[redirects]]
  from = "/shop/:slug"
  to = "/shop/product.html"
  status = 200

# React SPA routes — rewrite to app.html (the React entry) so client-side routing works.
# Marketing pages (/, /faq.html etc.) are served as static files and NOT rewritten.
[[redirects]]
  from = "/coaching/checkin"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/signup"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/forgot-password"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/reset-password"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/intake"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/snapshot"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/dashboard/admin"
  to = "/admin"
  status = 301

[[redirects]]
  from = "/dashboard/admin/*"
  to = "/admin/:splat"
  status = 301

[[redirects]]
  from = "/dashboard/*"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/affiliate/login"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/affiliate/dashboard"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/coach"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/coach/*"
  to = "/app.html"
  status = 200
