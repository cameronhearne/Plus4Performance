<style>
  .shop-filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:40px;}
  .filter-tab{
    border:1px solid var(--pebble);
    background:transparent;
    color:rgba(255,255,255,0.7);
    border-radius:var(--radius-pill);
    padding:10px 20px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    min-height:44px;
  }
  .filter-tab:hover{color:#fff;border-color:rgba(255,255,255,0.4);}
  .filter-tab[aria-pressed="true"]{background:var(--ember);color:#fff;border-color:var(--ember);}

  .shop-hero-banner{
    position:relative;
    aspect-ratio:2.4/1;
    border-radius:var(--radius);
    overflow:hidden;
    margin-bottom:40px;
    background:var(--ink);
    touch-action:pan-y;
  }
  @media(max-width:768px){
    .shop-hero-banner{aspect-ratio:auto;min-height:220px;}
  }

  /* Panels are positioned + clip-pathed entirely from JS (initHeroSlider in
     the script below) — geometry depends on measured container size and
     current panel count, which CSS alone can't express. These rules are
     just the visual defaults each panel/img gets once JS sets left/width/
     clip-path inline. */
  .hero-panels{position:absolute;inset:0;}
  .hero-panel{
    position:absolute;
    top:0;height:100%;
    left:0;width:100%;
    clip-path:none;
    display:none;
    overflow:hidden;
  }
  /* Pre-JS fallback: just show panel 0 full-bleed (same look as the single-
     panel mobile case) until initHeroSlider() measures the container and
     sets real left/width/clip-path on each panel. */
  .hero-panel[data-panel="0"]{display:block;}
  .hero-img{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    opacity:0;
    transition:opacity 0.6s ease;
    transition-delay:calc(var(--panel-i, 0) * 150ms);
  }
  .hero-img.is-active{opacity:1;z-index:1;}

  .hero-shade{
    position:absolute;inset:0;
    background:linear-gradient(to top, rgba(0,0,0,0.4), rgba(0,0,0,0) 55%);
    pointer-events:none;
    z-index:1;
  }

  .hero-arrow{
    position:absolute;top:50%;
    transform:translateY(-50%);
    width:40px;height:40px;
    border-radius:50%;
    border:none;
    background:rgba(10,10,12,0.5);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    z-index:2;
    font-size:16px;
    line-height:1;
    transition:background 0.2s ease;
  }
  .hero-arrow:hover{background:rgba(10,10,12,0.75);}
  .hero-arrow-prev{left:16px;}
  .hero-arrow-next{right:16px;}
  .hero-dots{
    position:absolute;bottom:16px;left:50%;
    transform:translateX(-50%);
    display:flex;gap:8px;
    z-index:2;
  }
  .hero-dot{
    width:8px;height:8px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,0.45);
    padding:0;
    cursor:pointer;
    transition:background 0.2s ease, transform 0.2s ease;
  }
  .hero-dot.is-active{background:#fff;transform:scale(1.3);}
  .hero-dot:focus-visible, .hero-arrow:focus-visible{
    outline:2px solid var(--ember-bright);
    outline-offset:2px;
  }
  @media(prefers-reduced-motion:reduce){
    .hero-img{transition:none;}
  }

  .shop-delivery-note{font-size:14px;color:var(--ash);margin:-8px 0 32px;}

  .shop-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:32px;
  }
  .shop-card-media-link{display:block;}
  .shop-card-media{
    position:relative;
    aspect-ratio:1/1;
    border-radius:var(--radius);
    overflow:hidden;
    background:#f4f4f4;
    margin-bottom:16px;
  }
  .shop-card-media img{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
  }
  .shop-card-img-back{opacity:0;transition:opacity 0.25s ease;}
  @media(hover:hover) and (pointer:fine){
    .shop-card-media-link:hover .shop-card-img-back{opacity:1;}
  }
  .shop-card-name-link{display:block;font-size:16px;font-weight:700;margin-bottom:4px;color:#fff;}
  .shop-card-name-link:hover{color:var(--ember-bright);}
  .shop-card-price{font-size:15px;color:var(--ash);margin-bottom:10px;}

  .shop-card-swatches{display:flex;flex-wrap:wrap;gap:4px 6px;}
  .swatch-btn{
    position:relative;
    width:24px;height:24px;
    display:flex;align-items:center;justify-content:center;
    background:none;
    border:none;
    border-radius:50%;
    padding:0;
    cursor:pointer;
  }
  .swatch-dot{
    width:14px;height:14px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.3);
    display:block;
  }
  .swatch-dot.is-light{border:1px solid rgba(0,0,0,0.35);}
  .swatch-btn[aria-pressed="true"] .swatch-dot{
    box-shadow:0 0 0 2px var(--ink), 0 0 0 4px var(--ember-bright);
  }
  .swatch-btn:focus-visible{
    outline:2px solid var(--ember-bright);
    outline-offset:3px;
  }
  .swatch-tooltip{
    position:absolute;
    bottom:100%;
    left:50%;
    transform:translate(-50%,-6px);
    background:var(--ink);
    color:#fff;
    font-size:11px;
    font-weight:600;
    line-height:1;
    white-space:nowrap;
    padding:5px 8px;
    border-radius:6px;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.15s ease;
    z-index:2;
  }
  .swatch-btn:hover .swatch-tooltip,
  .swatch-btn:focus-visible .swatch-tooltip{
    opacity:1;
  }
  @media(max-width:860px){
    .shop-grid{grid-template-columns:repeat(2,1fr);gap:20px;}
  }
</style>

<script>
(function(){
  var currentFilter = 'all';

  function slugifyColour(name){
    return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-)$/g, '');
  }

  function priceLabel(p){
    return (p.price === null || p.price === undefined) ? 'Coming soon' : '&pound;' + p.price;
  }

  function cardHTML(p){
    var colourIndex = 0;
    var colour = p.colours[colourIndex];
    var href = '/shop/' + p.slug + '?colour=' + slugifyColour(colour.name);

    return (
      '<div class="shop-card" data-slug="' + p.slug + '" data-category="' + p.category + '" data-colour-index="' + colourIndex + '">' +
        '<a class="shop-card-media-link reveal" href="' + href + '" aria-label="View ' + p.name + '">' +
          '<div class="shop-card-media" data-media></div>' +
        '</a>' +
        '<a class="shop-card-name-link" href="' + href + '" data-name-link>' + p.name + '</a>' +
        '<div class="shop-card-price">' + priceLabel(p) + '</div>' +
        '<div class="shop-card-swatches" role="group" aria-label="Colour">' +
          p.colours.map(function(c, i){
            return '<button type="button" class="swatch-btn" data-colour-index="' + i + '" ' +
              'aria-pressed="' + (i === 0 ? 'true' : 'false') + '" aria-label="' + c.name + '">' +
              '<span class="swatch-dot' + (c.light ? ' is-light' : '') + '" style="background:' + c.swatch + '"></span>' +
              '<span class="swatch-tooltip" aria-hidden="true">' + c.name + '</span>' +
            '</button>';
          }).join('') +
        '</div>' +
      '</div>'
    );
  }

  function renderCardMedia(cardEl, product, colourIndex){
    var colour = product.colours[colourIndex];
    var media = cardEl.querySelector('[data-media]');
    var html = '<img class="shop-card-img-front" src="' + colour.images[0] + '" alt="' + product.name + ' in ' + colour.name + '" loading="lazy">';
    if(colour.images[1]){
      html += '<img class="shop-card-img-back" src="' + colour.images[1] + '" alt="' + product.name + ' in ' + colour.name + ', back" loading="lazy">';
    }
    media.innerHTML = html;

    var href = '/shop/' + product.slug + '?colour=' + slugifyColour(colour.name);
    cardEl.querySelector('.shop-card-media-link').setAttribute('href', href);
    cardEl.querySelector('[data-name-link]').setAttribute('href', href);
  }

  function render(){
    var grid = document.getElementById('shop-grid');
    if(!grid || !window.P4P_PRODUCTS) return;
    var products = window.P4P_PRODUCTS.filter(function(p){
      return currentFilter === 'all' || p.category === currentFilter;
    });
    grid.innerHTML = products.map(cardHTML).join('');

    grid.querySelectorAll('.shop-card').forEach(function(cardEl){
      var slug = cardEl.getAttribute('data-slug');
      var product = window.P4P_PRODUCTS.filter(function(p){ return p.slug === slug; })[0];
      renderCardMedia(cardEl, product, 0);

      cardEl.querySelectorAll('.swatch-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
          cardEl.querySelectorAll('.swatch-btn').forEach(function(b){ b.setAttribute('aria-pressed', 'false'); });
          btn.setAttribute('aria-pressed', 'true');
          var colourIndex = parseInt(btn.getAttribute('data-colour-index'), 10);
          cardEl.setAttribute('data-colour-index', colourIndex);
          renderCardMedia(cardEl, product, colourIndex);
        });
      });
    });

    grid.querySelectorAll('.reveal').forEach(function(el){ el.classList.add('is-visible'); });
  }

  function initFilters(){
    var tabs = document.querySelectorAll('.filter-tab');
    tabs.forEach(function(tab){
      tab.addEventListener('click', function(){
        tabs.forEach(function(t){ t.setAttribute('aria-pressed', 'false'); });
        tab.setAttribute('aria-pressed', 'true');
        currentFilter = tab.getAttribute('data-filter');
        render();
      });
    });
  }

  /* Diagonal multi-panel hero slider.
     7 photos form one ordered list. At any time, each visible panel shows
     one photo from the list; a "set" is the whole row's worth of photos at
     once, and advancing moves every panel on to the next set together
     (wrapping back to photo 0 when the list runs out — see
     photoForPanelInSet). Panel count is responsive (3 / 2 / 1), so the
     number of sets and dots changes with it; resizing across a breakpoint
     resets to set 0 rather than trying to preserve position across a
     different grouping.
     Panel shape: each panel is an absolutely positioned, overlapping box
     (wider than its 1/N "fair share" so the diagonal clip has material to
     cut from) with a clip-path carved in JS from the measured container
     size — this keeps the gap and angle pixel-accurate at any width and
     keeps images themselves undistorted (only the panel's silhouette is
     cut, never the image). */
  function initHeroSlider(){
    var root = document.getElementById('hero-slider');
    var panelsRoot = document.getElementById('hero-panels');
    var dotsRoot = document.getElementById('hero-dots');
    if(!root || !panelsRoot || !dotsRoot) return;

    var TOTAL_PHOTOS = 7;
    var MAX_PANELS = 3;
    var ANGLE_DEG = 9;
    var GAP_PX = 6;
    var SAFETY_PX = 2;
    var AUTOPLAY_MS = 5000;
    var STAGGER_MS = 150;
    var SWIPE_THRESHOLD = 40;

    var panels = Array.prototype.slice.call(panelsRoot.querySelectorAll('.hero-panel')).slice(0, MAX_PANELS);
    var prevBtn = root.querySelector('.hero-arrow-prev');
    var nextBtn = root.querySelector('.hero-arrow-next');
    var reducedMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

    var panelCount = 0;
    var currentSet = 0;
    var dots = [];
    var timer = null;
    var resizeRAF = null;

    function panelsForWidth(){
      var w = window.innerWidth;
      if(w >= 1200) return 3;
      if(w >= 768) return 2;
      return 1;
    }

    function setCountFor(count){
      return Math.ceil(TOTAL_PHOTOS / count);
    }

    function photoForPanelInSet(setIndex, panelIndex, count){
      return (setIndex * count + panelIndex) % TOTAL_PHOTOS;
    }

    function renderDots(count){
      var sets = setCountFor(count);
      dotsRoot.innerHTML = '';
      dots = [];
      for(var i = 0; i < sets; i++){
        var dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'hero-dot' + (i === 0 ? ' is-active' : '');
        dot.setAttribute('role', 'tab');
        dot.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
        dot.setAttribute('aria-label', 'Slide set ' + (i + 1));
        (function(index){
          dot.addEventListener('click', function(){ goToSet(index); startAutoplay(); });
        })(i);
        dotsRoot.appendChild(dot);
        dots.push(dot);
      }
    }

    function applyActivePhoto(panelIndex, photoIndex){
      var panel = panels[panelIndex];
      var imgs = panel.querySelectorAll('.hero-img');
      imgs.forEach(function(img){
        var isMatch = parseInt(img.getAttribute('data-photo'), 10) === photoIndex;
        img.classList.toggle('is-active', isMatch);
      });
    }

    function goToSet(setIndex){
      var sets = setCountFor(panelCount);
      setIndex = ((setIndex % sets) + sets) % sets;
      currentSet = setIndex;
      for(var i = 0; i < panelCount; i++){
        applyActivePhoto(i, photoForPanelInSet(setIndex, i, panelCount));
      }
      if(dots[setIndex]){
        dots.forEach(function(d){ d.classList.remove('is-active'); d.setAttribute('aria-selected', 'false'); });
        dots[setIndex].classList.add('is-active');
        dots[setIndex].setAttribute('aria-selected', 'true');
      }
    }

    function nextSet(){ goToSet(currentSet + 1); }
    function prevSet(){ goToSet(currentSet - 1); }

    function stopAutoplay(){
      if(timer){ window.clearInterval(timer); timer = null; }
    }

    function startAutoplay(){
      stopAutoplay();
      if(reducedMotion || document.hidden) return;
      timer = window.setInterval(nextSet, AUTOPLAY_MS);
    }

    function panelCorners(i, count, width, height, shift, half){
      var nominal = width / count;
      var shareLeft = i * nominal;
      var shareRight = (i + 1) * nominal;
      var lTop, lBot, rTop, rBot;
      if(i === 0){ lTop = 0; lBot = 0; }
      else { lTop = shareLeft - half + GAP_PX / 2; lBot = shareLeft + half + GAP_PX / 2; }
      if(i === count - 1){ rTop = width; rBot = width; }
      else { rTop = shareRight - half - GAP_PX / 2; rBot = shareRight + half - GAP_PX / 2; }
      return { lTop: lTop, lBot: lBot, rTop: rTop, rBot: rBot };
    }

    function layoutPanels(){
      var rect = root.getBoundingClientRect();
      var width = rect.width;
      var height = rect.height;
      if(!width || !height) return;

      var newPanelCount = panelsForWidth();
      var panelCountChanged = newPanelCount !== panelCount;
      panelCount = newPanelCount;

      if(panelCount === 1){
        // Mobile: behaves exactly like the old single-image slider — panel 0
        // full-bleed, no diagonal, nothing to compute.
        var p0 = panels[0];
        p0.style.display = 'block';
        p0.style.left = '0px';
        p0.style.width = width + 'px';
        p0.style.clipPath = 'none';
        panels[1].style.display = 'none';
        panels[2].style.display = 'none';
      } else {
        var shift = height * Math.tan(ANGLE_DEG * Math.PI / 180);
        var half = shift / 2;
        var overlap = half + GAP_PX / 2 + SAFETY_PX;
        var nominal = width / panelCount;

        for(var i = 0; i < MAX_PANELS; i++){
          if(i >= panelCount){
            panels[i].style.display = 'none';
            continue;
          }
          var shareLeft = i * nominal;
          var shareRight = (i + 1) * nominal;
          var boxLeft = (i === 0) ? 0 : (shareLeft - overlap);
          var boxRight = (i === panelCount - 1) ? width : (shareRight + overlap);
          var boxWidth = boxRight - boxLeft;
          var corners = panelCorners(i, panelCount, width, height, shift, half);

          var panel = panels[i];
          panel.style.display = 'block';
          panel.style.left = boxLeft + 'px';
          panel.style.width = boxWidth + 'px';
          panel.style.clipPath = 'polygon(' +
            (corners.lTop - boxLeft) + 'px 0px, ' +
            (corners.rTop - boxLeft) + 'px 0px, ' +
            (corners.rBot - boxLeft) + 'px ' + height + 'px, ' +
            (corners.lBot - boxLeft) + 'px ' + height + 'px)';
        }
      }

      if(panelCountChanged){
        renderDots(panelCount);
        goToSet(0);
      }
    }

    prevBtn.addEventListener('click', function(){ prevSet(); startAutoplay(); });
    nextBtn.addEventListener('click', function(){ nextSet(); startAutoplay(); });

    root.addEventListener('mouseenter', stopAutoplay);
    root.addEventListener('mouseleave', startAutoplay);

    document.addEventListener('visibilitychange', function(){
      if(document.hidden){ stopAutoplay(); } else { startAutoplay(); }
    });

    var touchStartX = null;
    root.addEventListener('touchstart', function(e){
      touchStartX = e.touches[0].clientX;
      stopAutoplay();
    }, { passive: true });
    root.addEventListener('touchend', function(e){
      if(touchStartX === null) return;
      var dx = e.changedTouches[0].clientX - touchStartX;
      touchStartX = null;
      if(Math.abs(dx) > SWIPE_THRESHOLD){
        if(dx < 0){ nextSet(); } else { prevSet(); }
      }
      startAutoplay();
    }, { passive: true });

    window.addEventListener('resize', function(){
      if(resizeRAF) return;
      resizeRAF = window.requestAnimationFrame(function(){
        resizeRAF = null;
        layoutPanels();
      });
    });

    layoutPanels();
    startAutoplay();
  }

  document.addEventListener('DOMContentLoaded', function(){
    render();
    initFilters();
    initHeroSlider();
  });
})();
</script>
</body>
</html>
