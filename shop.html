<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop | Plus 4 Performance</title>
<meta name="description" content="Clothing we designed and wear ourselves. Made to order, printed on demand.">
<meta property="og:title" content="Shop | Plus 4 Performance">
<meta property="og:description" content="Clothing we designed and wear ourselves. Made to order, printed on demand.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://plus4performance.com/shop">
<meta property="og:image" content="https://plus4performance.com/images/logo/icon-512.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://plus4performance.com/shop">
<link rel="icon" href="/images/logo/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/images/logo/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/images/logo/favicon-16x16.png">
<link rel="apple-touch-icon" href="/images/logo/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css">
<style>
  .shop-filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:40px;}
  .filter-tab{
    border:1px solid var(--pebble);
    background:transparent;
    color:rgba(255,255,255,0.7);
    border-radius:var(--radius-pill);
    padding:10px 20px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    min-height:44px;
  }
  .filter-tab:hover{color:#fff;border-color:rgba(255,255,255,0.4);}
  .filter-tab[aria-pressed="true"]{background:var(--ember);color:#fff;border-color:var(--ember);}

  .shop-hero-banner{
    position:relative;
    aspect-ratio:2.4/1;
    border-radius:var(--radius);
    overflow:hidden;
    margin-bottom:40px;
    touch-action:pan-y;
  }
  @media(max-width:768px){
    .shop-hero-banner{aspect-ratio:auto;min-height:220px;}
  }

  .hero-slides{position:absolute;inset:0;}
  .hero-slide{
    position:absolute;inset:0;
    opacity:0;
    transition:opacity 0.6s ease;
  }
  .hero-slide.is-active{opacity:1;z-index:1;}
  .hero-slide img{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    object-position:center 30%;
  }
  .hero-arrow{
    position:absolute;top:50%;
    transform:translateY(-50%);
    width:40px;height:40px;
    border-radius:50%;
    border:none;
    background:rgba(10,10,12,0.5);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    z-index:2;
    font-size:16px;
    line-height:1;
    transition:background 0.2s ease;
  }
  .hero-arrow:hover{background:rgba(10,10,12,0.75);}
  .hero-arrow-prev{left:16px;}
  .hero-arrow-next{right:16px;}
  .hero-dots{
    position:absolute;bottom:16px;left:50%;
    transform:translateX(-50%);
    display:flex;gap:8px;
    z-index:2;
  }
  .hero-dot{
    width:8px;height:8px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,0.45);
    padding:0;
    cursor:pointer;
    transition:background 0.2s ease, transform 0.2s ease;
  }
  .hero-dot.is-active{background:#fff;transform:scale(1.3);}
  .hero-dot:focus-visible, .hero-arrow:focus-visible{
    outline:2px solid var(--ember-bright);
    outline-offset:2px;
  }
  @media(prefers-reduced-motion:reduce){
    .hero-slide{transition:none;}
  }

  .shop-delivery-note{font-size:14px;color:var(--ash);margin:-8px 0 32px;}

  .shop-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:32px;
  }
  .shop-card-media-link{display:block;}
  .shop-card-media{
    position:relative;
    aspect-ratio:1/1;
    border-radius:var(--radius);
    overflow:hidden;
    background:#f4f4f4;
    margin-bottom:16px;
  }
  .shop-card-media img{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
  }
  .shop-card-img-back{opacity:0;transition:opacity 0.25s ease;}
  @media(hover:hover) and (pointer:fine){
    .shop-card-media-link:hover .shop-card-img-back{opacity:1;}
  }
  .shop-card-name-link{display:block;font-size:16px;font-weight:700;margin-bottom:4px;color:#fff;}
  .shop-card-name-link:hover{color:var(--ember-bright);}
  .shop-card-price{font-size:15px;color:var(--ash);margin-bottom:10px;}

  .shop-card-swatches{display:flex;flex-wrap:wrap;gap:4px 6px;}
  .swatch-btn{
    position:relative;
    width:24px;height:24px;
    display:flex;align-items:center;justify-content:center;
    background:none;
    border:none;
    border-radius:50%;
    padding:0;
    cursor:pointer;
  }
  .swatch-dot{
    width:14px;height:14px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.3);
    display:block;
  }
  .swatch-dot.is-light{border:1px solid rgba(0,0,0,0.35);}
  .swatch-btn[aria-pressed="true"] .swatch-dot{
    box-shadow:0 0 0 2px var(--ink), 0 0 0 4px var(--ember-bright);
  }
  .swatch-btn:focus-visible{
    outline:2px solid var(--ember-bright);
    outline-offset:3px;
  }
  .swatch-tooltip{
    position:absolute;
    bottom:100%;
    left:50%;
    transform:translate(-50%,-6px);
    background:var(--ink);
    color:#fff;
    font-size:11px;
    font-weight:600;
    line-height:1;
    white-space:nowrap;
    padding:5px 8px;
    border-radius:6px;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.15s ease;
    z-index:2;
  }
  .swatch-btn:hover .swatch-tooltip,
  .swatch-btn:focus-visible .swatch-tooltip{
    opacity:1;
  }
  @media(max-width:860px){
    .shop-grid{grid-template-columns:repeat(2,1fr);gap:20px;}
  }
</style>
</head>
<body>
<div id="site-header" class="site-header"></div>

<section class="page-hero">
  <div class="wrap">
    <h1>Shop</h1>
    <p>Clothing we designed and wear ourselves. Made to order.</p>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="shop-hero-banner" id="hero-slider" aria-roledescription="carousel" aria-label="Shop highlights">
      <div class="hero-slides">
        <div class="hero-slide is-active" data-index="0">
          <img src="/images/shop/hero/hero-1-hoodie-back.jpg" alt="Plus Four black hoodie, back print" loading="eager">
        </div>
        <div class="hero-slide" data-index="1">
          <img src="/images/shop/hero/hero-2-grey-tee-back.jpg" alt="Plus Four grey tee, back print" loading="lazy">
        </div>
        <div class="hero-slide" data-index="2">
          <img src="/images/shop/hero/hero-3-grey-tee-front.jpg" alt="Plus Four grey tee, front" loading="lazy">
        </div>
        <div class="hero-slide" data-index="3">
          <img src="/images/shop/hero/hero-4-red-tee-back.jpg" alt="Plus Four red tee, back print" loading="lazy">
        </div>
        <div class="hero-slide" data-index="4">
          <img src="/images/shop/hero/hero-5-joggers.jpg" alt="Plus Four piped joggers" loading="lazy">
        </div>
      </div>
      <button type="button" class="hero-arrow hero-arrow-prev" aria-label="Previous slide">&#10094;</button>
      <button type="button" class="hero-arrow hero-arrow-next" aria-label="Next slide">&#10095;</button>
      <div class="hero-dots" role="tablist" aria-label="Slide navigation">
        <button type="button" class="hero-dot is-active" data-index="0" role="tab" aria-selected="true" aria-label="Slide 1"></button>
        <button type="button" class="hero-dot" data-index="1" role="tab" aria-selected="false" aria-label="Slide 2"></button>
        <button type="button" class="hero-dot" data-index="2" role="tab" aria-selected="false" aria-label="Slide 3"></button>
        <button type="button" class="hero-dot" data-index="3" role="tab" aria-selected="false" aria-label="Slide 4"></button>
        <button type="button" class="hero-dot" data-index="4" role="tab" aria-selected="false" aria-label="Slide 5"></button>
      </div>
    </div>
    <div class="shop-filters" role="group" aria-label="Filter products">
      <button type="button" class="filter-tab" data-filter="all" aria-pressed="true">All</button>
      <button type="button" class="filter-tab" data-filter="tees" aria-pressed="false">Tees</button>
      <button type="button" class="filter-tab" data-filter="hoodies" aria-pressed="false">Hoodies</button>
      <button type="button" class="filter-tab" data-filter="crewnecks" aria-pressed="false">Crewnecks</button>
      <button type="button" class="filter-tab" data-filter="joggers" aria-pressed="false">Joggers</button>
      <button type="button" class="filter-tab" data-filter="shorts" aria-pressed="false">Shorts</button>
    </div>
    <p class="shop-delivery-note">Made to order. Allow 2 to 4 days for production. Once shipped, around 60% of orders arrive within a week and 95% within 13 days. UK only.<br>UK delivery: £2.99 for a single tee, £3.99 for everything else. Free over £50.</p>
    <div class="shop-grid reveal-stagger" id="shop-grid"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="/js/products.js"></script>
<script src="/js/site.js" defer></script>
<script src="/js/basket.js" defer></script>
<script>
(function(){
  var currentFilter = 'all';

  function slugifyColour(name){
    return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-)$/g, '');
  }

  function priceLabel(p){
    return (p.price === null || p.price === undefined) ? 'Coming soon' : '&pound;' + p.price;
  }

  function cardHTML(p){
    var colourIndex = 0;
    var colour = p.colours[colourIndex];
    var href = '/shop/' + p.slug + '?colour=' + slugifyColour(colour.name);

    return (
      '<div class="shop-card" data-slug="' + p.slug + '" data-category="' + p.category + '" data-colour-index="' + colourIndex + '">' +
        '<a class="shop-card-media-link reveal" href="' + href + '" aria-label="View ' + p.name + '">' +
          '<div class="shop-card-media" data-media></div>' +
        '</a>' +
        '<a class="shop-card-name-link" href="' + href + '" data-name-link>' + p.name + '</a>' +
        '<div class="shop-card-price">' + priceLabel(p) + '</div>' +
        '<div class="shop-card-swatches" role="group" aria-label="Colour">' +
          p.colours.map(function(c, i){
            return '<button type="button" class="swatch-btn" data-colour-index="' + i + '" ' +
              'aria-pressed="' + (i === 0 ? 'true' : 'false') + '" aria-label="' + c.name + '">' +
              '<span class="swatch-dot' + (c.light ? ' is-light' : '') + '" style="background:' + c.swatch + '"></span>' +
              '<span class="swatch-tooltip" aria-hidden="true">' + c.name + '</span>' +
            '</button>';
          }).join('') +
        '</div>' +
      '</div>'
    );
  }

  function renderCardMedia(cardEl, product, colourIndex){
    var colour = product.colours[colourIndex];
    var media = cardEl.querySelector('[data-media]');
    var html = '<img class="shop-card-img-front" src="' + colour.images[0] + '" alt="' + product.name + ' in ' + colour.name + '" loading="lazy">';
    if(colour.images[1]){
      html += '<img class="shop-card-img-back" src="' + colour.images[1] + '" alt="' + product.name + ' in ' + colour.name + ', back" loading="lazy">';
    }
    media.innerHTML = html;

    var href = '/shop/' + product.slug + '?colour=' + slugifyColour(colour.name);
    cardEl.querySelector('.shop-card-media-link').setAttribute('href', href);
    cardEl.querySelector('[data-name-link]').setAttribute('href', href);
  }

  function render(){
    var grid = document.getElementById('shop-grid');
    if(!grid || !window.P4P_PRODUCTS) return;
    var products = window.P4P_PRODUCTS.filter(function(p){
      return currentFilter === 'all' || p.category === currentFilter;
    });
    grid.innerHTML = products.map(cardHTML).join('');

    grid.querySelectorAll('.shop-card').forEach(function(cardEl){
      var slug = cardEl.getAttribute('data-slug');
      var product = window.P4P_PRODUCTS.filter(function(p){ return p.slug === slug; })[0];
      renderCardMedia(cardEl, product, 0);

      cardEl.querySelectorAll('.swatch-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
          cardEl.querySelectorAll('.swatch-btn').forEach(function(b){ b.setAttribute('aria-pressed', 'false'); });
          btn.setAttribute('aria-pressed', 'true');
          var colourIndex = parseInt(btn.getAttribute('data-colour-index'), 10);
          cardEl.setAttribute('data-colour-index', colourIndex);
          renderCardMedia(cardEl, product, colourIndex);
        });
      });
    });

    grid.querySelectorAll('.reveal').forEach(function(el){ el.classList.add('is-visible'); });
  }

  function initFilters(){
    var tabs = document.querySelectorAll('.filter-tab');
    tabs.forEach(function(tab){
      tab.addEventListener('click', function(){
        tabs.forEach(function(t){ t.setAttribute('aria-pressed', 'false'); });
        tab.setAttribute('aria-pressed', 'true');
        currentFilter = tab.getAttribute('data-filter');
        render();
      });
    });
  }

  function initHeroSlider(){
    var root = document.getElementById('hero-slider');
    if(!root) return;
    var slides = Array.prototype.slice.call(root.querySelectorAll('.hero-slide'));
    var dots = Array.prototype.slice.call(root.querySelectorAll('.hero-dot'));
    var prevBtn = root.querySelector('.hero-arrow-prev');
    var nextBtn = root.querySelector('.hero-arrow-next');
    if(slides.length < 2) return;

    var AUTOPLAY_MS = 5000;
    var SWIPE_THRESHOLD = 40;
    var current = 0;
    var timer = null;
    var reducedMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

    function show(index){
      index = (index + slides.length) % slides.length;
      if(index === current) return;
      slides[current].classList.remove('is-active');
      dots[current].setAttribute('aria-selected', 'false');
      dots[current].classList.remove('is-active');
      current = index;
      slides[current].classList.add('is-active');
      dots[current].setAttribute('aria-selected', 'true');
      dots[current].classList.add('is-active');
    }

    function next(){ show(current + 1); }
    function prev(){ show(current - 1); }

    function stopAutoplay(){
      if(timer){ window.clearInterval(timer); timer = null; }
    }

    function startAutoplay(){
      stopAutoplay();
      if(reducedMotion || document.hidden) return;
      timer = window.setInterval(next, AUTOPLAY_MS);
    }

    prevBtn.addEventListener('click', function(){ prev(); startAutoplay(); });
    nextBtn.addEventListener('click', function(){ next(); startAutoplay(); });
    dots.forEach(function(dot, i){
      dot.addEventListener('click', function(){ show(i); startAutoplay(); });
    });

    root.addEventListener('mouseenter', stopAutoplay);
    root.addEventListener('mouseleave', startAutoplay);

    document.addEventListener('visibilitychange', function(){
      if(document.hidden){ stopAutoplay(); } else { startAutoplay(); }
    });

    var touchStartX = null;
    root.addEventListener('touchstart', function(e){
      touchStartX = e.touches[0].clientX;
      stopAutoplay();
    }, { passive: true });
    root.addEventListener('touchend', function(e){
      if(touchStartX === null) return;
      var dx = e.changedTouches[0].clientX - touchStartX;
      touchStartX = null;
      if(Math.abs(dx) > SWIPE_THRESHOLD){
        if(dx < 0){ next(); } else { prev(); }
      }
      startAutoplay();
    }, { passive: true });

    startAutoplay();
  }

  document.addEventListener('DOMContentLoaded', function(){
    render();
    initFilters();
    initHeroSlider();
  });
})();
</script>
</body>
</html>
