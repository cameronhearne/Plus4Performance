<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Size Guide | Plus 4 Performance</title>
<meta name="description" content="Size guide for Plus 4 Performance clothing.">
<meta property="og:title" content="Size Guide | Plus 4 Performance">
<meta property="og:description" content="Size guide for Plus 4 Performance clothing.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://plus4performance.com/size-guide">
<meta property="og:image" content="https://plus4performance.com/images/logo/icon-512.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://plus4performance.com/size-guide">
<link rel="icon" href="/images/logo/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/images/logo/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/images/logo/favicon-16x16.png">
<link rel="apple-touch-icon" href="/images/logo/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css">
<style>
  .size-guide-controls{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:8px;}
  .size-guide-how-cols{display:grid;grid-template-columns:1fr 1fr;gap:40px;}
  @media(max-width:600px){
    .size-guide-how-cols{grid-template-columns:1fr;gap:24px;}
  }
</style>
</head>
<body>
<div id="site-header" class="site-header"></div>

<section class="page-hero">
  <div class="wrap">
    <span class="eyebrow">Size Guide</span>
    <h1>Find your size.</h1>
    <p>Measurements are taken flat across the garment. If you're between sizes, we'd size up.</p>
  </div>
</section>

<section>
  <div class="wrap">
    <div id="size-guide-root"><p>Loading...</p></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="/js/products.js"></script>
<script src="/js/size-guides.js"></script>
<script src="/js/site.js" defer></script>
<script src="/js/basket.js" defer></script>
<script>
(function(){
  var unit = 'cm';

  function productsWithGuides(){
    var all = window.P4P_PRODUCTS || [];
    var guides = window.P4P_SIZE_GUIDES || {};
    return all.filter(function(p){ return !!guides[p.slug]; });
  }

  function jumpLinksHTML(products){
    return '<nav class="size-guide-jumplinks" aria-label="Jump to product">' +
      products.map(function(p){ return '<a href="#' + p.slug + '">' + p.name + '</a>'; }).join('') +
    '</nav>';
  }

  function controlsHTML(){
    return (
      '<div class="size-guide-controls">' +
        '<div class="size-guide-unit-toggle" role="group" aria-label="Units">' +
          '<button type="button" data-unit="cm" aria-pressed="' + (unit === 'cm' ? 'true' : 'false') + '">cm</button>' +
          '<button type="button" data-unit="in" aria-pressed="' + (unit === 'in' ? 'true' : 'false') + '">in</button>' +
        '</div>' +
      '</div>'
    );
  }

  function howToMeasureHTML(){
    var helpers = window.P4P_SIZE_GUIDE_HELPERS;
    return (
      '<div class="content-block reveal is-visible">' +
        '<h2>How to measure</h2>' +
        '<p>' + window.P4P_SIZE_GUIDE_NOTE + '</p>' +
        '<div class="size-guide-how-cols">' +
          '<div class="size-guide-how">' +
            '<h3>Tops</h3>' +
            helpers.howToMeasureHTML('top') +
          '</div>' +
          '<div class="size-guide-how">' +
            '<h3>Bottoms</h3>' +
            helpers.howToMeasureHTML('bottom') +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  function productSectionHTML(product){
    var helpers = window.P4P_SIZE_GUIDE_HELPERS;
    var guides = window.P4P_SIZE_GUIDES || {};
    var entry = guides[product.slug];
    return (
      '<div class="content-block reveal is-visible size-guide-section" id="' + product.slug + '">' +
        '<h2>' + product.name + '</h2>' +
        '<p class="size-guide-flat-note">' + window.P4P_SIZE_GUIDE_NOTE + '</p>' +
        '<div class="size-guide-table-wrap">' + helpers.tableHTML(entry, unit, product.sizes) + '</div>' +
      '</div>'
    );
  }

  function render(){
    var root = document.getElementById('size-guide-root');
    var products = productsWithGuides();

    if(!products.length){
      root.innerHTML = '<p>Size guide coming soon.</p>';
      return;
    }

    root.innerHTML =
      controlsHTML() +
      jumpLinksHTML(products) +
      howToMeasureHTML() +
      products.map(productSectionHTML).join('');

    root.querySelectorAll('.size-guide-unit-toggle [data-unit]').forEach(function(btn){
      btn.addEventListener('click', function(){
        unit = btn.getAttribute('data-unit');
        render();
      });
    });
  }

  document.addEventListener('DOMContentLoaded', render);
})();
</script>
</body>
</html>
